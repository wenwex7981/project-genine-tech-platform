<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Events Scout — GraduateNex</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    :root {
      --bg: #0f0f1a; --surface: #1a1a2e; --border: #252540;
      --accent: #7c3aed; --accent2: #ec4899; --green: #10b981;
      --yellow: #f59e0b; --red: #ef4444; --blue: #3b82f6;
      --text: #e2e8f0; --muted: #94a3b8; --r: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 420px; min-height: 580px; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }

    /* HEADER */
    .header { background: linear-gradient(135deg,#7c3aed,#ec4899); padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .hlogo { width: 34px; height: 34px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .htitle { font-weight: 800; font-size: 14px; color: #fff; }
    .hsub { font-size: 10px; color: rgba(255,255,255,0.75); margin-top: 1px; }
    .hbadge { margin-left: auto; background: rgba(255,255,255,0.2); border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; color: #fff; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
    .stat-n { font-size: 20px; font-weight: 800; line-height: 1; }
    .stat-n.g { color: var(--green); } .stat-n.y { color: var(--yellow); } .stat-n.p { color: var(--accent); }
    .stat-l { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* STATUS BAR */
    .status-bar { padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .pill.idle { background: rgba(148,163,184,0.1); border: 1px solid var(--border); color: var(--muted); }
    .pill.running { background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.4); color: #a78bfa; }
    .pill.done { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.4); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot.idle { background: var(--muted); }
    .dot.running { background: var(--accent); animation: pulse 1s infinite; }
    .dot.done { background: var(--green); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .cur-ht { font-size: 10px; color: var(--muted); margin-left: auto; }

    /* TABS */
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
    .tab { flex: 1; padding: 9px; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* SECTION */
    .sec { padding: 10px 12px; }
    .sec-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }

    /* HASHTAG TAGS */
    .tag-wrap { display: flex; flex-wrap: wrap; gap: 4px; max-height: 80px; overflow-y: auto; margin-bottom: 8px; }
    .htag { background: rgba(124,58,237,.12); border: 1px solid rgba(124,58,237,.3); border-radius: 20px; padding: 3px 9px; font-size: 10px; color: #a78bfa; cursor: pointer; user-select: none; transition: all .12s; }
    .htag:hover { background: rgba(124,58,237,.3); }
    .htag.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .htag.gaming { border-color: rgba(16,185,129,.4); color: #6ee7b7; background: rgba(16,185,129,.1); }
    .htag.gaming.active { background: #059669; border-color: #059669; color: #fff; }
    .htag.cultural { border-color: rgba(245,158,11,.4); color: #fcd34d; background: rgba(245,158,11,.1); }
    .htag.cultural.active { background: #d97706; border-color: #d97706; color: #fff; }

    /* BUTTONS */
    .btn { width: 100%; padding: 9px; border-radius: var(--r); border: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 12px; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: linear-gradient(135deg,#7c3aed,#ec4899); color: #fff; box-shadow: 0 4px 15px rgba(124,58,237,.3); }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-danger { background: rgba(239,68,68,.12); border: 1px solid var(--red); color: var(--red); }
    .btn-danger:hover { background: rgba(239,68,68,.25); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--text); }
    .btn + .btn { margin-top: 5px; }
    .row { display: flex; gap: 5px; }
    .row .btn { flex: 1; }

    /* LOG */
    .log { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); height: 120px; overflow-y: auto; padding: 7px 9px; font-family: monospace; font-size: 10.5px; }
    .le { display: flex; align-items: flex-start; gap: 5px; margin-bottom: 3px; line-height: 1.35; }
    .ld { width: 5px; height: 5px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .ld.info    { background: #60a5fa; } .ld.found  { background: var(--green); }
    .ld.pushed  { background: #34d399; } .ld.skip   { background: var(--yellow); }
    .ld.warn    { background: var(--yellow); } .ld.done { background: var(--accent); }
    .ld.navigate{ background: #818cf8; } .ld.error  { background: var(--red); }
    .lt { color: var(--muted); word-break: break-all; }

    /* EVENT CARDS (preview) */
    .ev-list { max-height: 240px; overflow-y: auto; }
    .ev-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; margin-bottom: 7px; display: flex; flex-direction: column;
      transition: border-color .15s;
    }
    .ev-card:hover { border-color: rgba(124,58,237,.5); }
    .ev-img { width: 100%; height: 80px; object-fit: cover; display: block; background: var(--border); }
    .ev-body { padding: 8px 10px; }
    .ev-title { font-weight: 700; font-size: 12px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ev-meta { font-size: 10px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
    .ev-links { display: flex; gap: 6px; flex-wrap: wrap; }
    .ev-link { font-size: 10px; padding: 2px 8px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: opacity .15s; }
    .ev-link:hover { opacity: .8; }
    .ev-link.insta { background: rgba(236,72,153,.15); border: 1px solid rgba(236,72,153,.3); color: #f9a8d4; }
    .ev-link.reg   { background: rgba(124,58,237,.15); border: 1px solid rgba(124,58,237,.3); color: #c4b5fd; }
    .ev-cat { font-size: 9px; padding: 1px 6px; border-radius: 8px; font-weight: 700; text-transform: uppercase; }
    .ev-cat.hackathon { background: rgba(124,58,237,.2); color: #a78bfa; }
    .ev-cat.gaming    { background: rgba(16,185,129,.2);  color: #6ee7b7; }
    .ev-cat.cultural  { background: rgba(245,158,11,.2);  color: #fcd34d; }
    .ev-cat.fest      { background: rgba(59,130,246,.2);  color: #93c5fd; }
    .ev-cat.event     { background: rgba(148,163,184,.1); color: var(--muted); }
    .ev-cat.workshop  { background: rgba(239,68,68,.15);  color: #fca5a5; }

    /* EMPTY */
    .empty { text-align: center; padding: 24px 10px; color: var(--muted); font-size: 12px; }
    .empty-emoji { font-size: 28px; margin-bottom: 6px; }

    /* INPUTS */
    .inp-g { margin-bottom: 8px; }
    .inp-l { font-size: 10px; color: var(--muted); margin-bottom: 3px; display: block; }
    .inp { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 11px; color: var(--text); font-family: inherit; outline: none; transition: border-color .15s; }
    .inp:focus { border-color: var(--accent); }
    .smsg { font-size: 10px; color: var(--green); margin-top: 5px; }

    .divider { height: 1px; background: var(--border); }
    .sp { height: 6px; }
    ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  </style>
</head>
<body>

<div class="header">
  <div class="hlogo">🔍</div>
  <div>
    <div class="htitle">Events Scout <span style="font-size:9px;background:rgba(255,255,255,0.2);padding:1px 6px;border-radius:10px;margin-left:4px;">AUTO-PUSH</span></div>
    <div class="hsub">Instagram → GraduateNex · No manual push needed</div>
  </div>
  <div class="hbadge" id="total-badge">0 pushed</div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n g" id="stat-found">0</div><div class="stat-l">Events Found</div></div>
  <div class="stat"><div class="stat-n y" id="stat-scanned">0</div><div class="stat-l">Posts Scanned</div></div>
  <div class="stat"><div class="stat-n p" id="stat-pushed">0</div><div class="stat-l">Auto-Pushed ✓</div></div>
</div>

<div class="status-bar">
  <div class="pill idle" id="status-pill">
    <span class="dot idle" id="status-dot"></span>
    <span id="status-text">Idle</span>
  </div>
  <span class="cur-ht" id="current-hashtag"></span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="scraper">🕷 Scraper</div>
  <div class="tab" data-tab="preview">📸 Preview</div>
  <div class="tab" data-tab="settings">⚙ Settings</div>
</div>

<!-- SCRAPER TAB -->
<div class="tab-panel active" id="tab-scraper">
  <div class="sec">
    <div class="sec-title">Categories to Scan</div>
    <div class="tag-wrap" id="hashtag-tags"></div>

    <div class="row">
      <button class="btn btn-primary" id="btn-start">▶ Start Auto-Scout</button>
      <button class="btn btn-danger" id="btn-stop" style="display:none;flex:none;width:auto;padding:9px 12px;">■ Stop</button>
    </div>
    <div class="sp"></div>
    <button class="btn btn-ghost" id="btn-retry" style="border-color:rgba(245,158,11,0.4);color:#f59e0b;">🔄 Retry Failed Pushes <span id="retry-count" style="background:rgba(245,158,11,0.2);border-radius:10px;padding:1px 6px;margin-left:4px;font-size:10px;">0</span></button>
    <div class="sp"></div>
    <button class="btn btn-ghost" id="btn-clear">🗑 Clear History</button>
  </div>
  <div class="divider"></div>
  <div class="sec">
    <div class="sec-title">Live Activity Log</div>
    <div class="log" id="log"></div>
  </div>
</div>

<!-- PREVIEW TAB -->
<div class="tab-panel" id="tab-preview">
  <div class="sec">
    <div class="sec-title">Pushed Events Preview</div>
    <div id="events-list">
      <div class="empty"><div class="empty-emoji">🔍</div><div>No events yet.<br>Start the scout!</div></div>
    </div>
  </div>
</div>

<!-- SETTINGS TAB -->
<div class="tab-panel" id="tab-settings">
  <div class="sec">
    <div class="sec-title">API Configuration</div>
    <div class="inp-g">
      <label class="inp-l">GraduateNex API URL</label>
      <input class="inp" id="api-url" value="https://graduatenex.online/api/insta-events" />
    </div>
    <div class="inp-g">
      <label class="inp-l">API Secret (optional)</label>
      <input class="inp" id="api-key" type="password" placeholder="leave blank if none" />
    </div>
    <div class="inp-g">
      <label class="inp-l">Max posts per hashtag</label>
      <input class="inp" id="max-posts" type="number" min="5" max="30" value="12" />
    </div>
    <button class="btn btn-ghost" id="btn-save-settings">💾 Save Settings</button>
    <div class="smsg" id="settings-msg"></div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
